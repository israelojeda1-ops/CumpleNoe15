<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>NOEMI 15 🖤</title>
<style>
  :root {
    color-scheme: dark;
    --bg1: #0a0a0c;
    --bg2: #1c0507;
    --card: #141416;
    --card-border: #3a0d14;
    --text: #f5f0f1;
    --muted: #b79aa2;
    --accent: #e0113c;
    --accent-dark: #9c0b2a;
    --pink-glow: #ff3d9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg1) 70%) fixed;
    color: var(--text);
    padding-bottom: 100px;
  }
  header {
    text-align: center;
    padding: 32px 16px 20px;
    color: #fff;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 2rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 800;
    background: linear-gradient(90deg, var(--pink-glow), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 26px rgba(224,17,60,0.45);
  }
  header p { margin: 0; opacity: 0.85; font-size: 0.9rem; letter-spacing: 0.5px; color: var(--muted); }

  #feed {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .post {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 12px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(224,17,60,0.06);
  }
  .post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 6px;
  }
  .post-header .name { font-weight: 700; font-size: 0.95rem; color: var(--text); }
  .post-header .time { font-size: 0.75rem; color: var(--muted); }
  .media-wrap { width: 100%; background: #000; }
  .media-wrap img { width: 100%; display: block; max-height: 480px; object-fit: cover; }
  .media-wrap iframe { width: 100%; height: 320px; border: 0; display: block; }
  .actions { display: flex; align-items: center; gap: 14px; padding: 10px 14px 4px; }
  .like-btn {
    border: none;
    background: none;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    transition: transform 0.1s ease;
  }
  .like-btn.liked { transform: scale(1.15); }
  .like-count { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .comments { padding: 6px 14px 14px; }
  .comment { font-size: 0.88rem; margin-bottom: 4px; color: var(--text); }
  .comment b { margin-right: 4px; color: var(--pink-glow); }
  .comment-form { display: flex; gap: 6px; margin-top: 8px; }
  .comment-form input {
    flex: 1;
    padding: 9px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--card-border);
    background: #0e0e10;
    color: var(--text);
    font-size: 0.85rem;
    outline: none;
  }
  .comment-form input:focus { border-color: var(--accent); }
  .comment-form button {
    border: none;
    background: linear-gradient(135deg, var(--pink-glow), var(--accent));
    color: #fff;
    border-radius: 20px;
    padding: 0 16px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #emptyState {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    opacity: 0.9;
  }

  .fab {
    position: fixed;
    right: 20px;
    bottom: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink-glow), var(--accent-dark));
    color: #fff;
    border: none;
    font-size: 1.8rem;
    box-shadow: 0 10px 28px rgba(224,17,60,0.5);
    cursor: pointer;
    z-index: 20;
  }

  #uploadModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 30;
  }
  #uploadModal.open { display: flex; }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 24px 22px 28px;
    max-width: 420px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
    position: relative;
    box-shadow: 0 0 40px rgba(224,17,60,0.25);
  }
  .close-modal {
    position: absolute;
    top: 14px;
    right: 16px;
    border: none;
    background: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--muted);
  }
  .modal-card h2 {
    font-size: 1.3rem;
    margin: 0 0 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text);
  }
  .modal-card .subtitle { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; }
  label {
    display: block;
    text-align: left;
    font-weight: 600;
    font-size: 0.85rem;
    margin: 14px 0 6px;
    color: var(--text);
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid var(--card-border);
    background: #0e0e10;
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: var(--accent); }
  .file-drop {
    margin-top: 14px;
    border: 2px dashed var(--accent-dark);
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    color: var(--pink-glow);
    font-weight: 600;
    position: relative;
  }
  .file-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #preview { margin-top: 14px; max-width: 100%; max-height: 220px; border-radius: 16px; display: none; }
  button#submitBtn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--pink-glow), var(--accent-dark));
    color: white;
    font-size: 1.05rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  button#submitBtn:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 0.9rem; min-height: 1.2em; }
  #status.ok { color: #4fd67a; }
  #status.error { color: #ff5470; }
</style>
</head>
<body>
  <header>
    <h1>Noemi 15 🖤</h1>
    <p>Sube tus fotos y videos, dale like y deja un comentario</p>
  </header>

  <div id="feed"></div>
  <div id="emptyState" style="display:none;">Todavia no hay fotos... ¡se la primera persona en subir una! 📸</div>

  <button class="fab" id="openUpload" title="Subir foto">＋</button>

  <div id="uploadModal">
    <div class="modal-card">
      <button class="close-modal" id="closeUpload">✕</button>
      <div style="font-size:1.8rem;">🖤📸🖤</div>
      <h2>¡Comparte tu foto!</h2>
      <p class="subtitle">Sube una foto o video de la fiesta y aparecera en la galeria.</p>

      <form id="uploadForm">
        <label for="guestName">Tu nombre</label>
        <input type="text" id="guestName" name="guestName" placeholder="Ej: Tia Marta" required />

        <div id="pinField" style="display:none;">
          <label for="pin">PIN del evento</label>
          <input type="password" id="pin" name="pin" placeholder="Pide el PIN al anfitrion" />
        </div>

        <label for="photo">Foto o video</label>
        <div class="file-drop" id="dropZone">
          📷 Toca aqui para elegir o tomar una foto
          <input type="file" id="photo" name="photo" accept="image/*,video/*" capture="environment" required />
        </div>
        <img id="preview" alt="Vista previa" />

        <button type="submit" id="submitBtn">Subir foto 🚀</button>
        <div id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const feedEl = document.getElementById('feed');
    const emptyState = document.getElementById('emptyState');
    const uploadModal = document.getElementById('uploadModal');
    const openUpload = document.getElementById('openUpload');
    const closeUpload = document.getElementById('closeUpload');
    const form = document.getElementById('uploadForm');
    const photoInput = document.getElementById('photo');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const pinField = document.getElementById('pinField');

    const likedLocally = new Set(JSON.parse(localStorage.getItem('likedPhotos') || '[]'));

    fetch('/api/config')
      .then(r => r.json())
      .then(cfg => {
        if (cfg.pinRequired) {
          pinField.style.display = 'block';
          document.getElementById('pin').required = true;
        }
      })
      .catch(() => {});

    openUpload.addEventListener('click', () => uploadModal.classList.add('open'));
    closeUpload.addEventListener('click', () => uploadModal.classList.remove('open'));
    uploadModal.addEventListener('click', (e) => {
      if (e.target === uploadModal) uploadModal.classList.remove('open');
    });

    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file) return;
      if (file.type.startsWith('image/')) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = photoInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      status.className = '';
      status.textContent = 'Subiendo... ⏳';

      const formData = new FormData();
      formData.append('guestName', document.getElementById('guestName').value);
      const pinValue = document.getElementById('pin').value;
      if (pinValue) formData.append('pin', pinValue);
      formData.append('photo', file);

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al subir');

        status.className = 'ok';
        status.textContent = '¡Foto subida! Gracias por compartirla 🎉';
        form.reset();
        preview.style.display = 'none';
        loadFeed();
        setTimeout(() => uploadModal.classList.remove('open'), 900);
      } catch (err) {
        status.className = 'error';
        status.textContent = err.message || 'Algo salio mal, intenta de nuevo';
      } finally {
        submitBtn.disabled = false;
      }
    });

    function timeAgo(iso) {
      const diffMs = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'ahora mismo';
      if (mins < 60) return `hace ${mins} min`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `hace ${hours} h`;
      return `hace ${Math.floor(hours / 24)} d`;
    }

    function mediaHtml(photo) {
      if (photo.mimeType.startsWith('video/')) {
        return `<div class="media-wrap"><iframe src="https://drive.google.com/file/d/${photo.driveFileId}/preview" allow="autoplay" allowfullscreen></iframe></div>`;
      }
      return `<div class="media-wrap"><img loading="lazy" src="https://drive.google.com/thumbnail?id=${photo.driveFileId}&sz=w1000" alt="Foto de ${photo.guestName}" /></div>`;
    }

    function commentsHtml(photo) {
      return photo.comments
        .map(c => `<div class="comment"><b>${escapeHtml(c.author)}</b>${escapeHtml(c.text)}</div>`)
        .join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderFeed(photos) {
      if (!photos.length) {
        feedEl.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';
      feedEl.innerHTML = photos.map(photo => `
        <div class="post" data-id="${photo.id}">
          <div class="post-header">
            <span class="name">${escapeHtml(photo.guestName)}</span>
            <span class="time">${timeAgo(photo.createdAt)}</span>
          </div>
          ${mediaHtml(photo)}
          <div class="actions">
            <button class="like-btn ${likedLocally.has(photo.id) ? 'liked' : ''}" data-action="like">
              ${likedLocally.has(photo.id) ? '❤️' : '🤍'}
            </button>
            <span class="like-count">${photo.likes} ${photo.likes === 1 ? 'like' : 'likes'}</span>
          </div>
          <div class="comments">
            ${commentsHtml(photo)}
            <form class="comment-form" data-action="comment">
              <input type="text" placeholder="Escribe un comentario..." maxlength="300" required />
              <button type="submit">Enviar</button>
            </form>
          </div>
        </div>
      `).join('');
    }

    feedEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action="like"]');
      if (!btn) return;
      const postEl = e.target.closest('.post');
      const id = postEl.dataset.id;
      if (likedLocally.has(id)) return;
      likedLocally.add(id);
      localStorage.setItem('likedPhotos', JSON.stringify([...likedLocally]));
      try {
        await fetch(`/api/photos/${id}/like`, { method: 'POST' });
        loadFeed();
      } catch {}
    });

    feedEl.addEventListener('submit', async (e) => {
      const commentForm = e.target.closest('[data-action="comment"]');
      if (!commentForm) return;
      e.preventDefault();
      const postEl = e.target.closest('.post');
      const id = postEl.dataset.id;
      const input = commentForm.querySelector('input');
      const text = input.value.trim();
      if (!text) return;
      const author = document.getElementById('guestName').value.trim() || 'Invitado';
      input.disabled = true;
      try {
        await fetch(`/api/photos/${id}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author, text }),
        });
        input.value = '';
        loadFeed();
      } catch {}
      input.disabled = false;
    });

    let lastScroll = 0;
    async function loadFeed() {
      lastScroll = window.scrollY;
      try {
        const res = await fetch('/api/photos');
        const photos = await res.json();
        renderFeed(photos);
      } catch {}
    }

    loadFeed();
    setInterval(loadFeed, 15000);
  </script>
</body>
</html>
